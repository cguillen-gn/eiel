# Cloudflare Worker — adjuntos EIEL → Google Drive (directo)
# Navegador PUT binario → Worker → Drive API (mismas carpetas).
name = "eiel-adjuntos"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Id de la carpeta raíz de adjuntos (mismo que CARPETA_RAIZ_ID en adjuntos.gs)
[vars]
DRIVE_ROOT_FOLDER_ID = "1XhyB9YD_m1jk_DTVzH782GWIiW62FPkV"
# Si usáis domain-wide delegation (recomendado frente a cuota SA):
# GOOGLE_IMPERSONATE_USER = "eiel@geonet.es"
# ALLOWED_ORIGINS = "https://eiel.diputacionalicante.es,https://otro-origen.es"
# (se suma a los orígenes por defecto del Worker; no los sustituye)

# Secretos (no van en el repo):
#   npx wrangler secret put UPLOAD_SECRET
# Camino sin admin Workspace (recomendado):
#   npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID
#   npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_OAUTH_REFRESH_TOKEN
# Alternativa SA (+ admin para impersonar):
#   npx wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
#
# Ya no hace falta R2 para este flujo.
