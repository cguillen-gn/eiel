# Cloudflare Worker — adjuntos EIEL (R2 + Drive)
# Subida rápida a R2; Apps Script importa a Drive (mismas carpetas).
name = "eiel-adjuntos"
main = "src/index.js"
compatibility_date = "2026-08-01"

# R2 bucket (crear en dashboard o: npx wrangler r2 bucket create eiel-adjuntos)
[[r2_buckets]]
binding = "ADJUNTOS_BUCKET"
bucket_name = "eiel-adjuntos"
preview_bucket_name = "eiel-adjuntos"

# Secretos:
#   npx wrangler secret put UPLOAD_SECRET   # firma de tokens put/get
# Opcional CORS:
# [vars]
# ALLOWED_ORIGINS = "https://cguillen-gn.github.io,http://localhost:5500"
