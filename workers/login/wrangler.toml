# Cloudflare Worker — login EIEL (sustituye URL_LOGIN_SCRIPT de Apps Script)
# Despliegue: ver README.md
name = "eiel-login"
main = "src/index.js"
compatibility_date = "2026-08-01"

# KV: mapa codigo → { clave, nombre }
[[kv_namespaces]]
binding = "CREDENTIALS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Secretos (no van en este fichero):
#   npx wrangler secret put MASTER_PASS
#   npx wrangler secret put SYNC_SECRET
#
# Opcional en [vars] solo para orígenes CORS extra (el default ya incluye github.io):
# [vars]
# ALLOWED_ORIGINS = "https://cguillen-gn.github.io,http://localhost:5500"
